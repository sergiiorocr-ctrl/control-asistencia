  <title>Control de Asistencia</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    * {

    body {

<body>


<div class="contenedor">


  <h1>
    CONTROL DE ASISTENCIA
  </h1>


  <div class="subtitulo">
    Escanea el código QR del empleado
  </div>


  <div id="reader"></div>


  <div id="resultado">

    <div class="esperando">
      Esperando QR...
    </div>

  </div>


  <!--
    ÚNICO BOTÓN DEL SISTEMA

    Antes de registrar:
    REGISTRAR

    Después de registrar:
    NUEVO REGISTRO
  -->

  <button
    id="botonRegistrar"
    class="oculto"
    onclick="confirmarRegistro()"
  >
    REGISTRAR
  </button>


</div>



<script>


/* ============================================================
   CONFIGURACIÓN
   ============================================================ */


const URL_APPS_SCRIPT =
  "https://script.google.com/macros/s/AKfycbwClqRJkgsM5iVOQqpOJP_YWicN-RII9OGOdxzFmb2BPNEhaa6HcHgWZVkmHSjoMow1/exec";


/*
  Parámetro utilizado por los QR actuales
  de Google Forms.
*/

const PARAMETRO_ID =
  "entry.1163066923";


/*
  Tiempo máximo de espera de Apps Script.
  10 segundos.
*/

const TIEMPO_LIMITE =
  10000;


/* ============================================================
   VARIABLES
   ============================================================ */


let html5QrCode = null;

let empleadoDetectado = null;

let empleadoInfo = null;

let procesando = false;

let scannerActivo = false;


/* ============================================================
   OBTENER ID DESDE EL QR
   ============================================================ */


function obtenerIDDesdeQR(contenido) {

  let id = contenido.trim();


  /*
    Los QR actuales contienen una URL
    de Google Forms con el ID del empleado.
  */

  try {

    const url =
      new URL(id);


    const empleadoID =
      url.searchParams.get(
        PARAMETRO_ID
      );


    if (empleadoID) {

      id =
        empleadoID.trim();

    }

  }

  catch (error) {

    /*
      Si el QR contiene directamente
      DEM-001, DEM-002, etc.,
      también funcionará.
    */

  }


  return id.toUpperCase();

}


/* ============================================================
   PETICIÓN CON TIEMPO LÍMITE
   ============================================================ */


async function consultarServidor(url) {

  const controlador =
    new AbortController();


  const tiempoLimite =
    setTimeout(
      function() {

        controlador.abort();

      },
      TIEMPO_LIMITE
    );


  try {

    const respuesta =
      await fetch(
        url,
        {
          method: "GET",
          signal: controlador.signal,
          cache: "no-store"
        }
      );


    clearTimeout(
      tiempoLimite
    );


    return await respuesta.json();

  }

  catch (error) {

    clearTimeout(
      tiempoLimite
    );


    throw error;

  }

}


/* ============================================================
   CUANDO SE DETECTA UN QR
   ============================================================ */


async function onScanSuccess(decodedText) {


  /*
    Evitar múltiples lecturas
    del mismo QR.
  */

  if (
    empleadoDetectado ||
    procesando
  ) {

    return;

  }


  const id =
    obtenerIDDesdeQR(
      decodedText
    );


  /*
    Validar formato.
  */

  if (
    !/^DEM-\d{3}$/.test(id)
  ) {

    document
      .getElementById("resultado")
      .innerHTML =

      '<div class="error">' +
      'QR NO VÁLIDO' +
      '</div>' +

      '<div class="id">' +
      'ID detectado: ' +
      id +
      '</div>';

    return;

  }


  /*
    Guardamos el empleado detectado.
  */

  empleadoDetectado =
    id;


  /*
    Detenemos la cámara para que
    no vuelva a leer el QR.
  */

  await detenerCamara();


  document
    .getElementById("resultado")
    .innerHTML =

    '<div class="esperando">' +
    'Consultando empleado...' +
    '</div>';


  /*
    Ocultar botón mientras se consulta.
  */

  document
    .getElementById(
      "botonRegistrar"
    )
    .classList.add(
      "oculto"
    );


  /*
    URL de consulta.
  */

  const url =

    URL_APPS_SCRIPT +

    "?accion=consultar&id=" +

    encodeURIComponent(id);


  try {

    const datos =
      await consultarServidor(
        url
      );


    /*
      Error devuelto por Apps Script.
    */

    if (!datos.ok) {

      empleadoDetectado =
        null;


      document
        .getElementById("resultado")
        .innerHTML =

        '<div class="error">' +
        'ERROR' +
        '</div>' +

        '<div class="confirmacion">' +

        (
          datos.mensaje ||
          'Empleado no encontrado.'
        ) +

        '</div>';


      iniciarCamara();


      return;

    }


    /*
      Guardamos los datos.
    */

    empleadoInfo =
      datos;


    /*
      Mostrar automáticamente
      los datos del empleado.
    */

    mostrarEmpleado();

  }

  catch (error) {

    console.error(
      "Error consultando servidor:",
      error
    );


    empleadoDetectado =
      null;


    document
      .getElementById("resultado")
      .innerHTML =

      '<div class="error">' +
      'ERROR DE CONEXIÓN' +
      '</div>' +

      '<div class="confirmacion">' +

      'No se pudo conectar con el servidor.' +

      '<br><br>' +

      'Revisa tu conexión a Internet ' +
      'e intenta nuevamente.' +

      '</div>';


    /*
      Volver a activar cámara
      para poder intentar otro QR.
    */

    iniciarCamara();

  }

}


/* ============================================================
   MOSTRAR DATOS DEL EMPLEADO
   ============================================================ */


function mostrarEmpleado() {


  const datos =
    empleadoInfo;


  document
    .getElementById("resultado")
    .innerHTML =

    '<div class="nombre">' +
    datos.nombre +
    '</div>' +

    '<div class="id">' +
    datos.id +
    '</div>' +

    '<div class="dato">' +
    '<strong>Área:</strong> ' +
    datos.area +
    '</div>' +

    '<div class="dato">' +
    '<strong>Contrato:</strong> ' +
    datos.contrato +
    '</div>' +

    '<div class="dato">' +
    '<strong>Supervisor:</strong> ' +
    datos.supervisor +
    '</div>';


  /*
    Mostrar el único botón.
  */

  const boton =
    document.getElementById(
      "botonRegistrar"
    );


  boton.innerText =
    "REGISTRAR";


  boton.onclick =
    confirmarRegistro;


  boton.disabled =
    false;


  boton.classList.remove(
    "oculto"
  );

}


/* ============================================================
   REGISTRAR ASISTENCIA
   ============================================================ */


async function confirmarRegistro() {


  if (
    !empleadoDetectado ||
    procesando
  ) {

    return;

  }


  procesando =
    true;


  const boton =
    document.getElementById(
      "botonRegistrar"
    );


  boton.disabled =
    true;


  document
    .getElementById("resultado")
    .innerHTML =

    '<div class="esperando">' +
    'REGISTRANDO...' +
    '</div>';


  /*
    URL para registrar.
  */

  const url =

    URL_APPS_SCRIPT +

    "?accion=registrar&id=" +

    encodeURIComponent(
      empleadoDetectado
    );


  try {

    const datos =
      await consultarServidor(
        url
      );


    mostrarResultado(
      datos
    );

  }

  catch (error) {

    console.error(
      "Error registrando:",
      error
    );


    document
      .getElementById("resultado")
      .innerHTML =

      '<div class="error">' +
      'ERROR DE CONEXIÓN' +
      '</div>' +

      '<div class="confirmacion">' +

      'No se pudo completar el registro.' +

      '<br><br>' +

      'Revisa tu conexión a Internet ' +
      'e intenta nuevamente.' +

      '</div>';


    boton.disabled =
      false;


    procesando =
      false;

  }

}


/* ============================================================
   MOSTRAR RESULTADO DEL REGISTRO
   ============================================================ */


function mostrarResultado(datos) {


  const resultado =
    document.getElementById(
      "resultado"
    );


  /*
    Si hubo un error.
  */

  if (!datos.ok) {

    resultado.innerHTML =

      '<div class="error">' +
      'ERROR' +
      '</div>' +

      '<div class="confirmacion">' +

      (
        datos.mensaje ||
        'No se pudo registrar.'
      ) +

      '</div>';


    const boton =
      document.getElementById(
        "botonRegistrar"
      );


    boton.disabled =
      false;


    procesando =
      false;


    return;

  }


  /*
    Determinar color del resultado.
  */

  let clase = "";


  if (
    datos.tipo === "Entrada"
  ) {

    clase =
      "entrada";

  }

  else if (
    datos.tipo === "Salida"
  ) {

    clase =
      "salida";

  }

  else {

    clase =
      "revisar";

  }


  /*
    Mostrar resultado final.
  */

  resultado.innerHTML =

    '<div class="nombre">' +
    datos.nombre +
    '</div>' +

    '<div class="id">' +
    datos.id +
    '</div>' +

    '<div class="dato">' +
    '<strong>Área:</strong> ' +
    datos.area +
    '</div>' +

    '<div class="dato">' +
    '<strong>Contrato:</strong> ' +
    datos.contrato +
    '</div>' +

    '<div class="dato">' +
    '<strong>Supervisor:</strong> ' +
    datos.supervisor +
    '</div>' +

    '<div class="tipo ' +
    clase +
    '">' +
    datos.tipo +
    '</div>' +

    '<div class="hora">' +
    datos.hora +
    '</div>';


  /*
    El mismo botón ahora se convierte
    en NUEVO REGISTRO.
  */

  const boton =
    document.getElementById(
      "botonRegistrar"
    );


  boton.innerText =
    "NUEVO REGISTRO";


  boton.onclick =
    volverAEscanear;


  boton.disabled =
    false;


  boton.classList.remove(
    "oculto"
  );


  procesando =
    false;

}


/* ============================================================
   NUEVO REGISTRO
   ============================================================ */


function volverAEscanear() {


  /*
    Limpiar información anterior.
  */

  empleadoDetectado =
    null;

  empleadoInfo =
    null;

  procesando =
    false;


  /*
    Configurar nuevamente
    el único botón.
  */

  const boton =
    document.getElementById(
      "botonRegistrar"
    );


  boton.innerText =
    "REGISTRAR";


  boton.onclick =
    confirmarRegistro;


  boton.disabled =
    false;


  boton.classList.add(
    "oculto"
  );


  /*
    Limpiar pantalla.
  */

  document
    .getElementById("resultado")
    .innerHTML =

    '<div class="esperando">' +
    'Esperando QR...' +
    '</div>';


  /*
    Reactivar cámara.
  */

  iniciarCamara();

}


/* ============================================================
   INICIAR CÁMARA
   ============================================================ */


function iniciarCamara() {


  /*
    Si la cámara ya está activa,
    no hacemos nada.
  */

  if (
    scannerActivo
  ) {

    return;

  }


  scannerActivo =
    true;


  /*
    Crear lector.
  */

  html5QrCode =
    new Html5Qrcode(
      "reader"
    );


  const configuracion = {

    fps: 10,

    qrbox: {
      width: 250,
      height: 250
    },

    aspectRatio: 1.0

  };


  /*
    Intentar primero cámara trasera.
  */

  html5QrCode
    .start(

      {
        facingMode: {
          exact: "environment"
        }
      },

      configuracion,

      onScanSuccess,

      onScanFailure

    )

    .catch(

      function(error) {

        console.log(
          "No se pudo iniciar la cámara trasera:",
          error
        );


        iniciarCamaraAlternativa();

      }

    );

}


/* ============================================================
   CÁMARA ALTERNATIVA
   ============================================================ */


function iniciarCamaraAlternativa() {


  try {

    html5QrCode.clear();

  }

  catch (error) {}


  html5QrCode =
    new Html5Qrcode(
      "reader"
    );


  const configuracion = {

    fps: 10,

    qrbox: {
      width: 250,
      height: 250
    },

    aspectRatio: 1.0

  };


  html5QrCode
    .start(

      {
        facingMode: "environment"
      },

      configuracion,

      onScanSuccess,

      onScanFailure

    )

    .catch(

      function(error) {

        console.error(
          error
        );


        scannerActivo =
          false;


        document
          .getElementById(
            "resultado"
          )
          .innerHTML =

          '<div class="error">' +
          'NO SE PUDO ACTIVAR LA CÁMARA' +
          '</div>' +

          '<div class="confirmacion">' +

          'Revisa los permisos de cámara ' +
          'del navegador.' +

          '</div>';

      }

    );

}


/* ============================================================
   DETENER CÁMARA
   ============================================================ */


async function detenerCamara() {


  if (
    !html5QrCode ||
    !scannerActivo
  ) {

    return;

  }


  try {

    await html5QrCode.stop();

  }

  catch (error) {

    console.log(
      "Error al detener cámara:",
      error
    );

  }


  scannerActivo =
    false;

}


/* ============================================================
   ERROR DE ESCANEO
   ============================================================ */


function onScanFailure(error) {

  /*
    Los errores normales de lectura
    no se muestran.
  */

}


/* ============================================================
   ARRANCAR AL ABRIR LA PÁGINA
   ============================================================ */


window.addEventListener(
  "load",
  function() {

    iniciarCamara();

  }
);


</script>


</body>

</html>
