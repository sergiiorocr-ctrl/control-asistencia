<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Control de Asistencia</title>

  <script src="https://unpkg.com/html5-qrcode"></script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #f2f2f2;

      text-align: center;

      color: #222;

    }


    .contenedor {

      width: 100%;

      max-width: 500px;

      margin: auto;

      padding: 20px;

    }


    h1 {

      margin:
        5px 0 5px 0;

      font-size: 27px;

    }


    .subtitulo {

      color: #666;

      margin-bottom: 20px;

      font-size: 17px;

    }


    /* =====================================================
       LECTOR
       ===================================================== */

    #reader {

      width: 100%;

      max-width: 450px;

      margin: auto;

      background: white;

      border-radius: 15px;

      overflow: hidden;

      box-shadow:
        0 2px 8px rgba(0,0,0,0.10);

    }


    /* =====================================================
       RESULTADO
       ===================================================== */

    #resultado {

      margin-top: 20px;

      padding: 22px;

      border-radius: 15px;

      background: white;

      min-height: 170px;

      box-shadow:
        0 2px 8px rgba(0,0,0,0.08);

    }


    .nombre {

      font-size: 25px;

      font-weight: bold;

      margin-bottom: 8px;

    }


    .id {

      color: #666;

      font-size: 18px;

      margin-top: 4px;

    }


    .dato {

      font-size: 17px;

      margin-top: 7px;

    }


    .dato strong {

      font-weight: bold;

    }


    .tipo {

      font-size: 32px;

      font-weight: bold;

      margin-top: 18px;

    }


    .hora {

      font-size: 20px;

      margin-top: 8px;

    }


    .entrada {

      color: #188038;

    }


    .salida {

      color: #d93025;

    }


    .revisar {

      color: #f29900;

    }


    .error {

      color: #d93025;

      font-weight: bold;

      font-size: 20px;

    }


    .esperando {

      color: #777;

      font-size: 18px;

    }


    .confirmacion {

      margin-top: 18px;

      color: #555;

      font-size: 17px;

    }


    /* =====================================================
       BOTONES
       ===================================================== */

    button {

      width: 100%;

      max-width: 350px;

      padding: 18px;

      margin-top: 20px;

      border: none;

      border-radius: 12px;

      font-size: 22px;

      font-weight: bold;

      cursor: pointer;

    }


    #botonRegistrar {

      background: #188038;

      color: white;

    }


    #botonRegistrar:disabled {

      background: #aaa;

      cursor: not-allowed;

    }


    #botonSiguiente {

      background: #333;

      color: white;

    }


    .oculto {

      display: none;

    }

  </style>

</head>


<body>


<div class="contenedor">


  <h1>
    CONTROL DE ASISTENCIA
  </h1>


  <div class="subtitulo">

    Escanea el código QR del empleado

  </div>


  <!-- =====================================================
       CÁMARA
       ===================================================== -->

  <div id="reader"></div>


  <!-- =====================================================
       INFORMACIÓN
       ===================================================== -->

  <div id="resultado">

    <div class="esperando">

      Esperando QR...

    </div>

  </div>


  <!-- =====================================================
       REGISTRAR
       ===================================================== -->

  <button
    id="botonRegistrar"
    class="oculto"
    onclick="confirmarRegistro()"
  >

    REGISTRAR

  </button>


  <!-- =====================================================
       SIGUIENTE
       ===================================================== -->

  <button
    id="botonSiguiente"
    class="oculto"
    onclick="volverAEscanear()"
  >

    LISTO / SIGUIENTE

  </button>


</div>



<script>


/* ==========================================================
   CONFIGURACIÓN
   ========================================================== */


/*
 * URL DE TU APLICACIÓN WEB
 */

const URL_APPS_SCRIPT =
  "https://script.google.com/macros/s/AKfycbwClqRJkgsM5iVOQqpOJP_YWicN-RII9OGOdxzFmb2BPNEhaa6HcHgWZVkmHSjoMow1/exec";


/*
 * Parámetro que contienen tus QR actuales.
 */

const PARAMETRO_ID =
  "entry.1163066923";


/* ==========================================================
   VARIABLES
   ========================================================== */


let html5QrCode = null;

let empleadoDetectado = null;

let empleadoInfo = null;

let procesando = false;

let scannerActivo = false;


/* ==========================================================
   EXTRAER ID DEL QR
   ========================================================== */


function obtenerIDDesdeQR(
  contenido
) {


  let id =
    contenido.trim();


  /*
   * Intentamos interpretar el QR
   * como una URL.
   */

  try {

    const url =
      new URL(id);


    const empleadoID =
      url.searchParams.get(
        PARAMETRO_ID
      );


    if (empleadoID) {

      id =
        empleadoID.trim();

    }

  }

  catch (error) {

    /*
     * Si no es una URL,
     * usamos directamente el contenido.
     */

  }


  return id.toUpperCase();

}


/* ==========================================================
   QR DETECTADO
   ========================================================== */


async function onScanSuccess(
  decodedText
) {


  /*
   * Si ya estamos procesando
   * un empleado, ignoramos otros QR.
   */

  if (
    empleadoDetectado ||
    procesando
  ) {

    return;

  }


  const id =
    obtenerIDDesdeQR(
      decodedText
    );


  /*
   * Validar ID.
   */

  if (
    !/^DEM-\d{3}$/.test(id)
  ) {


    document
      .getElementById("resultado")
      .innerHTML =

      '<div class="error">' +

      'QR NO VÁLIDO' +

      '</div>' +

      '<div class="id">' +

      'ID detectado: ' +

      id +

      '</div>';


    return;

  }


  /*
   * Guardar ID temporalmente.
   */

  empleadoDetectado =
    id;


  /*
   * Evitar lecturas repetidas.
   */

  await detenerCamara();


  /*
   * Mostrar que estamos buscando
   * la información.
   */

  document
    .getElementById("resultado")
    .innerHTML =

    '<div class="esperando">' +

    'Consultando empleado...' +

    '</div>';


  /*
   * Consultar Apps Script.
   *
   * IMPORTANTE:
   * Esto solamente consulta.
   * Todavía NO registra asistencia.
   */

  const url =

    URL_APPS_SCRIPT +

    "?accion=consultar&id=" +

    encodeURIComponent(id);


  try {


    const respuesta =
      await fetch(url);


    const datos =
      await respuesta.json();


    /*
     * Si hubo error.
     */

    if (!datos.ok) {


      empleadoDetectado =
        null;


      document
        .getElementById("resultado")
        .innerHTML =

        '<div class="error">' +

        'ERROR' +

        '</div>' +

        '<div class="confirmacion">' +

        (
          datos.mensaje ||
          'Empleado no encontrado.'
        ) +

        '</div>';


      iniciarCamara();


      return;

    }


    /*
     * Guardar información.
     */

    empleadoInfo =
      datos;


    /*
     * Mostrar empleado.
     */

    mostrarEmpleado();

  }

  catch (error) {


    console.error(
      error
    );


    empleadoDetectado =
      null;


    document
      .getElementById("resultado")
      .innerHTML =

      '<div class="error">' +

      'NO SE PUDO CONSULTAR' +

      '</div>' +

      '<div class="confirmacion">' +

      'Revisa la conexión a Internet.' +

      '</div>';


    /*
     * Volver a activar cámara.
     */

    iniciarCamara();

  }

}


/* ==========================================================
   MOSTRAR EMPLEADO
   ========================================================== */


function mostrarEmpleado() {


  const datos =
    empleadoInfo;


  document
    .getElementById("resultado")
    .innerHTML =


    '<div class="nombre">' +

    datos.nombre +

    '</div>' +


    '<div class="id">' +

    datos.id +

    '</div>' +


    '<div class="dato">' +

    '<strong>Área:</strong> ' +

    datos.area +

    '</div>' +


    '<div class="dato">' +

    '<strong>Contrato:</strong> ' +

    datos.contrato +

    '</div>' +


    '<div class="dato">' +

    '<strong>Supervisor:</strong> ' +

    datos.supervisor +

    '</div>' +


    '<div class="confirmacion">' +

    'Verifica los datos y pulsa ' +

    '<strong>REGISTRAR</strong>' +

    '</div>';


  /*
   * Mostrar botón REGISTRAR.
   */

  document
    .getElementById(
      "botonRegistrar"
    )
    .classList
    .remove("oculto");


  /*
   * Asegurar que esté habilitado.
   */

  document
    .getElementById(
      "botonRegistrar"
    )
    .disabled =
    false;

}


/* ==========================================================
   REGISTRAR
   ========================================================== */


async function confirmarRegistro() {


  /*
   * Seguridad.
   */

  if (
    !empleadoDetectado ||
    procesando
  ) {

    return;

  }


  procesando =
    true;


  /*
   * Deshabilitar botón.
   */

  const boton =
    document
      .getElementById(
        "botonRegistrar"
      );


  boton.disabled =
    true;


  /*
   * Mostrar mensaje.
   */

  document
    .getElementById("resultado")
    .innerHTML =

    '<div class="esperando">' +

    'REGISTRANDO...' +

    '</div>';


  /*
   * URL de registro.
   */

  const url =

    URL_APPS_SCRIPT +

    "?accion=registrar&id=" +

    encodeURIComponent(
      empleadoDetectado
    );


  try {


    const respuesta =
      await fetch(url);


    const datos =
      await respuesta.json();


    /*
     * Mostrar resultado.
     */

    mostrarResultado(
      datos
    );

  }

  catch (error) {


    console.error(
      error
    );


    document
      .getElementById("resultado")
      .innerHTML =

      '<div class="error">' +

      'NO SE PUDO REGISTRAR' +

      '</div>' +

      '<div class="confirmacion">' +

      'Revisa la conexión a Internet.' +

      '</div>';


    boton.disabled =
      false;


    procesando =
      false;

  }

}


/* ==========================================================
   RESULTADO DEL REGISTRO
   ========================================================== */


function mostrarResultado(
  datos
) {


  const resultado =
    document
      .getElementById(
        "resultado"
      );


  /*
   * Error.
   */

  if (!datos.ok) {


    resultado.innerHTML =

      '<div class="error">' +

      'ERROR' +

      '</div>' +

      '<div class="confirmacion">' +

      (
        datos.mensaje ||
        'No se pudo registrar.'
      ) +

      '</div>';


    document
      .getElementById(
        "botonRegistrar"
      )
      .disabled =
      false;


    procesando =
      false;


    return;

  }


  /*
   * Determinar color.
   */

  let clase =
    "";


  if (
    datos.tipo ===
    "Entrada"
  ) {

    clase =
      "entrada";

  }

  else if (
    datos.tipo ===
    "Salida"
  ) {

    clase =
      "salida";

  }

  else {

    clase =
      "revisar";

  }


  /*
   * Mostrar resultado.
   */

  resultado.innerHTML =

    '<div class="nombre">' +

    datos.nombre +

    '</div>' +


    '<div class="id">' +

    datos.id +

    '</div>' +


    '<div class="dato">' +

    '<strong>Área:</strong> ' +

    datos.area +

    '</div>' +


    '<div class="dato">' +

    '<strong>Contrato:</strong> ' +

    datos.contrato +

    '</div>' +


    '<div class="dato">' +

    '<strong>Supervisor:</strong> ' +

    datos.supervisor +

    '</div>' +


    '<div class="tipo ' +

    clase +

    '">' +

    datos.tipo +

    '</div>' +


    '<div class="hora">' +

    datos.hora +

    '</div>';


  /*
   * Ocultar REGISTRAR.
   */

  document
    .getElementById(
      "botonRegistrar"
    )
    .classList
    .add("oculto");


  /*
   * Mostrar SIGUIENTE.
   */

  document
    .getElementById(
      "botonSiguiente"
    )
    .classList
    .remove("oculto");

}


/* ==========================================================
   SIGUIENTE
   ========================================================== */


async function volverAEscanear() {


  /*
   * Limpiar datos anteriores.
   */

  empleadoDetectado =
    null;

  empleadoInfo =
    null;

  procesando =
    false;


  /*
   * Ocultar botones.
   */

  document
    .getElementById(
      "botonRegistrar"
    )
    .classList
    .add("oculto");


  document
    .getElementById(
      "botonSiguiente"
    )
    .classList
    .add("oculto");


  /*
   * Habilitar botón.
   */

  document
    .getElementById(
      "botonRegistrar"
    )
    .disabled =
    false;


  /*
   * Mensaje.
   */

  document
    .getElementById(
      "resultado"
    )
    .innerHTML =

    '<div class="esperando">' +

    'Esperando QR...' +

    '</div>';


  /*
   * Iniciar nuevamente la cámara.
   */

  iniciarCamara();

}


/* ==========================================================
   INICIAR CÁMARA
   ========================================================== */


function iniciarCamara() {


  /*
   * Si ya está funcionando,
   * no crear otra.
   */

  if (
    scannerActivo
  ) {

    return;

  }


  scannerActivo =
    true;


  /*
   * Crear lector.
   */

  html5QrCode =
    new Html5Qrcode(
      "reader"
    );


  /*
   * Configuración.
   *
   * facingMode: environment
   * intenta utilizar la cámara trasera.
   */

  const configuracion = {

    fps: 10,

    qrbox: {

      width: 250,

      height: 250

    },

    aspectRatio: 1.0

  };


  /*
   * Intentar primero cámara trasera.
   */

  html5QrCode
    .start(

      {
        facingMode:
          {
            exact:
              "environment"
          }
      },

      configuracion,

      onScanSuccess,

      onScanFailure

    )

    .catch(

      function(error) {


        console.log(
          "No se pudo iniciar la cámara trasera:",
          error
        );


        /*
         * Si el teléfono no permite
         * seleccionar environment de
         * esa manera, intentamos
         * simplemente environment.
         */

        iniciarCamaraAlternativa();

      }
    );

}


/* ==========================================================
   CÁMARA ALTERNATIVA
   ========================================================== */


function iniciarCamaraAlternativa() {


  /*
   * Destruir instancia anterior.
   */

  try {

    html5QrCode.clear();

  }

  catch (error) {}


  html5QrCode =
    new Html5Qrcode(
      "reader"
    );


  const configuracion = {

    fps: 10,

    qrbox: {

      width: 250,

      height: 250

    },

    aspectRatio: 1.0

  };


  html5QrCode
    .start(

      {
        facingMode:
          "environment"
      },

      configuracion,

      onScanSuccess,

      onScanFailure

    )

    .catch(

      function(error) {


        console.error(
          error
        );


        scannerActivo =
          false;


        document
          .getElementById(
            "resultado"
          )
          .innerHTML =

          '<div class="error">' +

          'NO SE PUDO ACTIVAR LA CÁMARA' +

          '</div>' +

          '<div class="confirmacion">' +

          'Revisa los permisos de cámara del navegador.' +

          '</div>';

      }
    );

}


/* ==========================================================
   DETENER CÁMARA
   ========================================================== */


async function detenerCamara() {


  if (
    !html5QrCode ||
    !scannerActivo
  ) {

    return;

  }


  try {

    await html5QrCode.stop();

  }

  catch (error) {

    console.log(
      "Error al detener cámara:",
      error
    );

  }


  scannerActivo =
    false;

}


/* ==========================================================
   ERROR NORMAL DEL SCANNER
   ========================================================== */


function onScanFailure(
  error
) {

  /*
   * No hacemos nada.
   *
   * El scanner genera estos mensajes
   * constantemente mientras busca un QR.
   */

}


/* ==========================================================
   INICIAR
   ========================================================== */


window.addEventListener(
  "load",
  function() {

    iniciarCamara();

  }
);


</script>


</body>

</html>
