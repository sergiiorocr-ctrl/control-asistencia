  <title>Control de Asistencia</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    * {
      box-sizing: border-box;

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;

<body>


<div class="contenedor">


  <h1>
    CONTROL DE ASISTENCIA
  </h1>


  <div class="subtitulo">

    Escanea el código QR del empleado

  </div>


  <div id="reader"></div>


  <div id="resultado">

    <div class="esperando">

      Esperando QR...

    </div>

  </div>


  <!--
    ÚNICO BOTÓN DEL SISTEMA

    Primero:
    REGISTRAR

    Después de registrar:
    NUEVO REGISTRO
  -->

  <button
    id="botonRegistrar"
    class="oculto"
    onclick="confirmarRegistro()"
  >

    REGISTRAR

  </button>


</div>



<script>


/* ============================================================
   CONFIGURACIÓN
   ============================================================ */


const URL_APPS_SCRIPT =
  "https://script.google.com/macros/s/AKfycbwClqRJkgsM5iVOQqpOJP_YWicN-RII9OGOdxzFmb2BPNEhaa6HcHgWZVkmHSjoMow1/exec";


/*
  Parámetro que contiene el ID dentro de los QR
  actuales de Google Forms.
*/

const PARAMETRO_ID =
  "entry.1163066923";


/* ============================================================
   VARIABLES
   ============================================================ */


let html5QrCode = null;

let empleadoDetectado = null;

let empleadoInfo = null;

let procesando = false;

let scannerActivo = false;


/* ============================================================
   OBTENER ID DESDE EL QR
   ============================================================ */


function obtenerIDDesdeQR(contenido) {

  let id = contenido.trim();


  /*
    Primero intentamos saber si el QR contiene
    una URL de Google Forms.
  */

  try {

    const url = new URL(id);

    const empleadoID =
      url.searchParams.get(
        PARAMETRO_ID
      );

    if (empleadoID) {

      id = empleadoID.trim();

    }

  }

  catch (error) {

    /*
      Si no es una URL,
      simplemente usamos el contenido
      directamente como ID.
    */

  }


  return id.toUpperCase();

}


/* ============================================================
   CUANDO SE DETECTA UN QR
   ============================================================ */


async function onScanSuccess(decodedText) {


  /*
    Evita que el mismo QR se procese
    varias veces mientras se está consultando.
  */

  if (
    empleadoDetectado ||
    procesando
  ) {

    return;

  }


  const id =
    obtenerIDDesdeQR(
      decodedText
    );


  /*
    Validar ID.
  */

  if (
    !/^DEM-\d{3}$/.test(id)
  ) {

    document
      .getElementById("resultado")
      .innerHTML =

      '<div class="error">' +
      'QR NO VÁLIDO' +
      '</div>' +

      '<div class="id">' +
      'ID detectado: ' +
      id +
      '</div>';

    return;

  }


  /*
    Guardamos temporalmente el empleado.
  */

  empleadoDetectado = id;


  /*
    Detenemos la cámara mientras
    consultamos los datos.
  */

  await detenerCamara();


  document
    .getElementById("resultado")
    .innerHTML =

    '<div class="esperando">' +
    'Consultando empleado...' +
    '</div>';


  /*
    Consultar Apps Script.
  */

  const url =

    URL_APPS_SCRIPT +

    "?accion=consultar&id=" +

    encodeURIComponent(id);


  try {

    const respuesta =
      await fetch(url);


    const datos =
      await respuesta.json();


    /*
      Si Apps Script devuelve error.
    */

    if (!datos.ok) {

      empleadoDetectado = null;


      document
        .getElementById("resultado")
        .innerHTML =

        '<div class="error">' +
        'ERROR' +
        '</div>' +

        '<div class="confirmacion">' +

        (
          datos.mensaje ||
          'Empleado no encontrado.'
        ) +

        '</div>';


      iniciarCamara();

      return;

    }


    /*
      Guardamos los datos del empleado.
    */

    empleadoInfo = datos;


    /*
      Mostramos los datos.
    */

    mostrarEmpleado();

  }

  catch (error) {

    console.error(error);


    empleadoDetectado = null;


    document
      .getElementById("resultado")
      .innerHTML =

      '<div class="error">' +
      'NO SE PUDO CONSULTAR' +
      '</div>' +

      '<div class="confirmacion">' +
      'Revisa la conexión a Internet.' +
      '</div>';


    iniciarCamara();

  }

}


/* ============================================================
   MOSTRAR EMPLEADO
   ============================================================ */


function mostrarEmpleado() {


  const datos =
    empleadoInfo;


  document
    .getElementById("resultado")
    .innerHTML =

    '<div class="nombre">' +
    datos.nombre +
    '</div>' +

    '<div class="id">' +
    datos.id +
    '</div>' +

    '<div class="dato">' +
    '<strong>Área:</strong> ' +
    datos.area +
    '</div>' +

    '<div class="dato">' +
    '<strong>Contrato:</strong> ' +
    datos.contrato +
    '</div>' +

    '<div class="dato">' +
    '<strong>Supervisor:</strong> ' +
    datos.supervisor +
    '</div>' +

    '<div class="confirmacion">' +
    'Verifica los datos y pulsa ' +
    '<strong>REGISTRAR</strong>' +
    '</div>';


  /*
    Configurar el único botón.
  */

  const boton =
    document.getElementById(
      "botonRegistrar"
    );


  boton.innerText =
    "REGISTRAR";


  boton.onclick =
    confirmarRegistro;


  boton.disabled =
    false;


  boton.classList.remove(
    "oculto"
  );

}


/* ============================================================
   REGISTRAR ASISTENCIA
   ============================================================ */


async function confirmarRegistro() {


  if (
    !empleadoDetectado ||
    procesando
  ) {

    return;

  }


  procesando = true;


  const boton =
    document.getElementById(
      "botonRegistrar"
    );


  boton.disabled = true;


  document
    .getElementById("resultado")
    .innerHTML =

    '<div class="esperando">' +
    'REGISTRANDO...' +
    '</div>';


  /*
    Llamamos a Apps Script
    para registrar la asistencia.
  */

  const url =

    URL_APPS_SCRIPT +

    "?accion=registrar&id=" +

    encodeURIComponent(
      empleadoDetectado
    );


  try {

    const respuesta =
      await fetch(url);


    const datos =
      await respuesta.json();


    mostrarResultado(datos);

  }

  catch (error) {

    console.error(error);


    document
      .getElementById("resultado")
      .innerHTML =

      '<div class="error">' +
      'NO SE PUDO REGISTRAR' +
      '</div>' +

      '<div class="confirmacion">' +
      'Revisa la conexión a Internet.' +
      '</div>';


    boton.disabled = false;

    procesando = false;

  }

}


/* ============================================================
   MOSTRAR RESULTADO DEL REGISTRO
   ============================================================ */


function mostrarResultado(datos) {


  const resultado =
    document.getElementById(
      "resultado"
    );


  /*
    Si Apps Script devuelve error.
  */

  if (!datos.ok) {

    resultado.innerHTML =

      '<div class="error">' +
      'ERROR' +
      '</div>' +

      '<div class="confirmacion">' +

      (
        datos.mensaje ||
        'No se pudo registrar.'
      ) +

      '</div>';


    const boton =
      document.getElementById(
        "botonRegistrar"
      );


    boton.disabled = false;

    procesando = false;

    return;

  }


  /*
    Elegir color según el tipo.
  */

  let clase = "";


  if (
    datos.tipo === "Entrada"
  ) {

    clase = "entrada";

  }

  else if (
    datos.tipo === "Salida"
  ) {

    clase = "salida";

  }

  else {

    clase = "revisar";

  }


  /*
    Mostrar resultado.
  */

  resultado.innerHTML =

    '<div class="nombre">' +
    datos.nombre +
    '</div>' +

    '<div class="id">' +
    datos.id +
    '</div>' +

    '<div class="dato">' +
    '<strong>Área:</strong> ' +
    datos.area +
    '</div>' +

    '<div class="dato">' +
    '<strong>Contrato:</strong> ' +
    datos.contrato +
    '</div>' +

    '<div class="dato">' +
    '<strong>Supervisor:</strong> ' +
    datos.supervisor +
    '</div>' +

    '<div class="tipo ' +
    clase +
    '">' +
    datos.tipo +
    '</div>' +

    '<div class="hora">' +
    datos.hora +
    '</div>';


  /*
    El mismo botón ahora sirve
    para iniciar un nuevo registro.
  */

  const boton =
    document.getElementById(
      "botonRegistrar"
    );


  boton.innerText =
    "NUEVO REGISTRO";


  boton.onclick =
    volverAEscanear;


  boton.disabled = false;


  boton.classList.remove(
    "oculto"
  );


  procesando = false;

}


/* ============================================================
   NUEVO REGISTRO
   ============================================================ */


function volverAEscanear() {


  /*
    Limpiar empleado anterior.
  */

  empleadoDetectado = null;

  empleadoInfo = null;

  procesando = false;


  /*
    Configurar nuevamente el botón.
  */

  const boton =
    document.getElementById(
      "botonRegistrar"
    );


  boton.innerText =
    "REGISTRAR";


  boton.onclick =
    confirmarRegistro;


  boton.disabled = false;


  boton.classList.add(
    "oculto"
  );


  /*
    Limpiar resultado.
  */

  document
    .getElementById("resultado")
    .innerHTML =

    '<div class="esperando">' +
    'Esperando QR...' +
    '</div>';


  /*
    Volver a activar cámara.
  */

  iniciarCamara();

}


/* ============================================================
   INICIAR CÁMARA
   ============================================================ */


function iniciarCamara() {


  /*
    Si ya está funcionando,
    no hacemos nada.
  */

  if (
    scannerActivo
  ) {

    return;

  }


  scannerActivo = true;


  /*
    Crear el lector.
  */

  html5QrCode =
    new Html5Qrcode(
      "reader"
    );


  const configuracion = {

    fps: 10,

    qrbox: {
      width: 250,
      height: 250
    },

    aspectRatio: 1.0

  };


  /*
    Primero intentamos abrir
    específicamente la cámara trasera.
  */

  html5QrCode
    .start(

      {
        facingMode: {
          exact: "environment"
        }
      },

      configuracion,

      onScanSuccess,

      onScanFailure

    )

    .catch(

      function(error) {

        console.log(
          "No se pudo iniciar la cámara trasera:",
          error
        );


        iniciarCamaraAlternativa();

      }

    );

}


/* ============================================================
   CÁMARA ALTERNATIVA
   ============================================================ */


function iniciarCamaraAlternativa() {


  /*
    Intentamos limpiar el lector anterior.
  */

  try {

    html5QrCode.clear();

  }

  catch (error) {}


  /*
    Crear un nuevo lector.
  */

  html5QrCode =
    new Html5Qrcode(
      "reader"
    );


  const configuracion = {

    fps: 10,

    qrbox: {
      width: 250,
      height: 250
    },

    aspectRatio: 1.0

  };


  /*
    Segundo intento de cámara trasera.
  */

  html5QrCode
    .start(

      {
        facingMode: "environment"
      },

      configuracion,

      onScanSuccess,

      onScanFailure

    )

    .catch(

      function(error) {

        console.error(error);


        scannerActivo = false;


        document
          .getElementById(
            "resultado"
          )
          .innerHTML =

          '<div class="error">' +
          'NO SE PUDO ACTIVAR LA CÁMARA' +
          '</div>' +

          '<div class="confirmacion">' +
          'Revisa los permisos de cámara del navegador.' +
          '</div>';

      }

    );

}


/* ============================================================
   DETENER CÁMARA
   ============================================================ */


async function detenerCamara() {


  if (
    !html5QrCode ||
    !scannerActivo
  ) {

    return;

  }


  try {

    await html5QrCode.stop();

  }

  catch (error) {

    console.log(
      "Error al detener cámara:",
      error
    );

  }


  scannerActivo = false;

}


/* ============================================================
   ERROR DE ESCANEO
   ============================================================ */


function onScanFailure(error) {

  /*
    No mostramos errores de lectura
    porque son normales mientras
    la cámara está buscando un QR.
  */

}


/* ============================================================
   INICIAR AUTOMÁTICAMENTE
   ============================================================ */


window.addEventListener(
  "load",
  function() {

    iniciarCamara();

  }
);


</script>


</body>

</html>
